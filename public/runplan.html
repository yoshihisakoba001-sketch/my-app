  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #05050A;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px 40px;
      font-family: 'Space Grotesk', sans-serif;
      transition: background 0.35s ease;
    }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes crownBounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-4px); }
    }
    @keyframes podiumGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(255,215,0,0.4); }
      50%       { box-shadow: 0 0 20px rgba(255,215,0,0.8); }
    }
    @keyframes flamePulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.15); }
    }
    @keyframes lvBounce {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes xpFill {
      0%   { width: 0%; }
      100% { width: 75%; }
    }
    @keyframes shineSweep {
      0%   { left: -50%; }
      60%  { left: 120%; }
      100% { left: 120%; }
    }
    @keyframes coachPulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(197,255,71,0.4); }
      50%       { box-shadow: 0 4px 32px rgba(197,255,71,0.8); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes typingDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1); opacity: 1; }
    }
  </style>

          )}

    </div>
  );
};

// ── Card ──────────────────────────────────────────────────────────────
const Card = ({ children, style = {}, onClick }) => {
  const t = useTheme();
  return (
    <div onClick={onClick} style={{
      background: t.cardBg,
      border: `1px solid ${t.border}`,
      borderRadius: 16, padding: '16px',
      backdropFilter: 'blur(10px)',
      cursor: onClick ? 'pointer' : 'default',
      boxShadow: t.isDark ? 'none' : '0 2px 12px rgba(0,0,0,0.06)',
      ...style,
    }}>{children}</div>
  );
};

// ── Pill ──────────────────────────────────────────────────────────────
const Pill = ({ children, color, bg }) => {
  const t = useTheme();
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      padding: '3px 10px', borderRadius: 99,
      background: bg || t.accentPillBg,
      color: color || t.accent,
      fontSize: 11, fontWeight: 600, letterSpacing: '0.02em',
    }}>{children}</span>
  );
};

// ── ProgressBar ───────────────────────────────────────────────────────
const ProgressBar = ({ value, max, color, height = 4, style = {} }) => {
  const t = useTheme();
  const c = color || t.accent;
  const pct = Math.min(100, (value / max) * 100);
  return (
    <div style={{ background: t.progressBg, borderRadius: 99, height, overflow: 'hidden', ...style }}>
      <div style={{ width: `${pct}%`, height: '100%', borderRadius: 99, background: c,
        transition: 'width 0.6s cubic-bezier(0.4,0,0.2,1)',
        boxShadow: `0 0 8px ${c}60` }}/>
    </div>
  );
};

// ── Avatar ────────────────────────────────────────────────────────────
const Avatar = ({ name, size = 36 }) => {
  const t = useTheme();
  const palettes = t.isDark
    ? ['#C5FF47','#47B8FF','#FF7847','#B847FF','#47FFB8']
    : ['#E8570A','#0080E0','#1FAF52','#9B3DD9','#E0A800'];
  const color = palettes[name.charCodeAt(0) % palettes.length];
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: `${color}20`, border: `1.5px solid ${color}55`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: size * 0.38, fontWeight: 700, color, flexShrink: 0,
    }}>{name[0]}</div>
  );
};

// Section label

  const t = useTheme();
  return (
    <div style={{ fontSize: 11, color: t.text3, fontWeight: 600,
      letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 8 }}>
      {children}
    </div>
  );
};

  Icon, StatusBar, BottomNav, Card, Pill, ProgressBar, Avatar, SectionLabel,

                      boxShadow: t.isDark ? 'none' : '0 1px 4px rgba(0,0,0,0.06)',
                    }}/>
                  </div>
                ))}
              </div>
            ) : (
              <>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10 }}>
                  <Field label="距離" value={form.distance} unit="km" color={t.accent}
                    onChange={v => setForm(f => ({ ...f, distance: v }))}/>
                  <Field label="タイム" value={form.time} color={t.accent2}
                    onChange={v => setForm(f => ({ ...f, time: v }))}/>
                  <Field label="ペース" value={form.pace} unit="/km" color={t.accent3}
                    onChange={v => setForm(f => ({ ...f, pace: v }))}/>
                  <Field label="心拍数" value={form.hr} unit="bpm" color={t.danger}
                    onChange={v => setForm(f => ({ ...f, hr: v }))}/>
                </div>
                <div style={{ marginTop: 10 }}>
                  <div style={{ fontSize: 10, color: t.text3, fontWeight: 600,
                    letterSpacing: '0.06em', marginBottom: 5, textTransform: 'uppercase' }}>メモ</div>
                  <textarea value={form.note} onChange={e => setForm(f => ({ ...f, note: e.target.value }))}
                    placeholder="感想・コメントを追加..." rows={2} style={{
                      width: '100%', padding: '12px 14px', borderRadius: 10,
                      background: t.inputBg, border: `1px solid ${t.border}`,
                      color: t.text, fontSize: 13, outline: 'none', resize: 'none',
                      fontFamily: 'Space Grotesk, sans-serif',
                    }}/>
                </div>
              </>
            )}
          </div>
        )}

        {(tab !== 'suunto' || parsed) && (
          <button onClick={handleSave} style={{
            width: '100%', marginTop: 20, padding: '15px',
            background: t.buttonGradient, border: 'none', borderRadius: 14,
            fontSize: 16, fontWeight: 700, color: t.accentText, cursor: 'pointer',
            boxShadow: `0 4px 20px ${t.accent}44`,
          }}>記録を保存する</button>
        )}
      </div>
      <div style={{ height: 20 }}/>
    </div>
  );
};

  };

  // ─── Pixel building helper ───
  const PixelBuilding = ({ x, y, w, h, fill, dark, winColor, winRows=4, winCols=2, roofColor }) => {
    const wSpacing = Math.floor(w / (winCols + 1));
    const hSpacing = Math.floor(h / (winRows + 1));
    const wins = [];
    for (let r = 0; r < winRows; r++) {
      for (let c = 0; c < winCols; c++) {
        wins.push({ x: x + wSpacing*(c+1) - 4, y: y + hSpacing*(r+1) - 3 });
      }
    }
    // horizontal mortar lines every 8px
    const mortarLines = Array.from({ length: Math.ceil(h/8) }, (_, i) => i);
    return (
      <g>
        <rect x={x} y={y} width={w} height={h} fill={fill}/>
        {mortarLines.map(i => (
          <rect key={i} x={x} y={y+i*8} width={w} height={1} fill={dark} opacity="0.45"/>
        ))}
        {/* vertical block breaks every 16px */}
        {Array.from({length: Math.ceil(w/16)}, (_,i) => (
          <rect key={i} x={x+i*16} y={y} width={1} height={h} fill={dark} opacity="0.3"/>
        ))}
        {wins.map((win, i) => (
          <rect key={i} x={win.x} y={win.y} width={8} height={6} fill={winColor}/>
        ))}
        {roofColor && <rect x={x-2} y={y-4} width={w+4} height={6} fill={roofColor}/>}
      </g>
    );

const AICoach = ({ isDark, onClose, initialMessage }) => {
  const t = isDark ? DARK : LIGHT;
  const [messages, setMessages] = useState([
    {
      role: 'assistant',
      content: initialMessage || 'こんにちは！AIコーチです 🏃\n今日のトレーニングや計画について何でも聞いてください！',
    }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, loading]);

  useEffect(() => {
    if (initialMessage) {
      callAPI([{ role: 'assistant', content: initialMessage }]);
    }
  }, []);

  const callAPI = async (currentMessages) => {
    setLoading(true);
    try {
      const response = await fetch('/api/coach', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: `あなたはRunPlanのAIランニングコーチです。
ユーザーの目標：東京マラソン2027（フルマラソン）完走。
現在の累計走行距離：284km。今週目標42km、達成28km。

役割：
- トレーニング計画の作成・調整
- 記録へのフィードバック・応援・褒める
- 天気や体調に合わせた代替メニュー提案
- 走力向上のアドバイス

口調：親しみやすく励ましを忘れずに。絵文字を適度に使う。返答は短めに（3〜5文）。`,
          messages: currentMessages.map(m => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await response.json();
      const reply = data.content?.[0]?.text || 'すみません、もう一度試してください。';
      setMessages(prev => [...prev, { role: 'assistant', content: reply }]);
    } catch {
      setMessages(prev => [...prev, { role: 'assistant', content: 'エラーが発生しました。もう一度試してください。' }]);
    } finally {
      setLoading(false);
    }
  };

  const send = async () => {
    if (!input.trim() || loading) return;
    const userMsg = { role: 'user', content: input };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setInput('');
    await callAPI(newMessages);
  };

  const quickReplies = ['今日のアドバイスを聞かせて', 'プランを作りたい', '雨の日の代替メニューは？', '体調が悪い時は？'];

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 1000, display: 'flex', flexDirection: 'column', animation: 'fadeIn 0.2s ease' }}>
      <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(4px)' }}/>
      <div style={{
        position: 'absolute', bottom: 0, left: '50%', transform: 'translateX(-50%)',
        width: '100%', maxWidth: 390, height: '80%',
        background: isDark ? '#0C0C1A' : '#F0F2F8',
        borderRadius: '24px 24px 0 0',
        display: 'flex', flexDirection: 'column',
        animation: 'slideUp 0.3s cubic-bezier(0.34,1.1,0.64,1)',
        border: `1px solid ${isDark ? 'rgba(197,255,71,0.15)' : 'rgba(0,0,0,0.1)'}`,
        borderBottom: 'none',
      }}>
        {/* Header */}
        <div style={{
          padding: '16px 20px 12px',
          borderBottom: `1px solid ${isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)'}`,
          display: 'flex', alignItems: 'center', gap: 12, flexShrink: 0,
        }}>
          <div style={{
            width: 40, height: 40, borderRadius: '50%',
            background: isDark ? 'linear-gradient(135deg, #C5FF47, #47B8FF)' : 'linear-gradient(135deg, #F12B7E, #0080E0)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
          }}><span style={{ fontSize: 20 }}>🏃</span></div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: isDark ? '#EEEEF8' : '#1A1A2A' }}>AIコーチ</div>
            <div style={{ fontSize: 11, color: isDark ? '#7777A0' : '#585878' }}>いつでも相談してください</div>
          </div>
          <button onClick={onClose} style={{
            background: isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)',
            border: 'none', borderRadius: '50%', width: 32, height: 32,
            cursor: 'pointer', color: isDark ? '#EEEEF8' : '#1A1A2A',
            fontSize: 18, display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>×</button>
        </div>

        {/* Messages */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '16px 16px 8px' }} className="hide-scroll">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {messages.map((msg, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: msg.role === 'user' ? 'flex-end' : 'flex-start' }}>
                {msg.role === 'assistant' && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                    <div style={{ width: 20, height: 20, borderRadius: '50%', background: isDark ? 'linear-gradient(135deg, #C5FF47, #47B8FF)' : 'linear-gradient(135deg, #F12B7E, #0080E0)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <span style={{ fontSize: 10 }}>🏃</span>
                    </div>
                    <span style={{ fontSize: 11, color: isDark ? '#7777A0' : '#585878', fontWeight: 600 }}>AIコーチ</span>
                  </div>
                )}
                <div style={{
                  maxWidth: '80%', padding: '10px 14px',
                  borderRadius: msg.role === 'user' ? '14px 14px 4px 14px' : '14px 14px 14px 4px',
                  background: msg.role === 'user' ? (isDark ? 'rgba(197,255,71,0.13)' : 'rgba(241,43,126,0.1)') : (isDark ? 'rgba(26,26,40,0.9)' : 'rgba(255,255,255,0.9)'),
                  border: `1px solid ${msg.role === 'user' ? (isDark ? 'rgba(197,255,71,0.25)' : 'rgba(241,43,126,0.22)') : (isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)')}`,
                  fontSize: 13, lineHeight: 1.6, color: isDark ? '#EEEEF8' : '#1A1A2A', whiteSpace: 'pre-wrap',
                }}>{msg.content}</div>
              </div>
            ))}
            {loading && (
              <div style={{ alignSelf: 'flex-start' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                  <div style={{ width: 20, height: 20, borderRadius: '50%', background: isDark ? 'linear-gradient(135deg, #C5FF47, #47B8FF)' : 'linear-gradient(135deg, #F12B7E, #0080E0)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <span style={{ fontSize: 10 }}>🏃</span>
                  </div>
                  <span style={{ fontSize: 11, color: isDark ? '#7777A0' : '#585878', fontWeight: 600 }}>AIコーチ</span>
                </div>
                <div style={{ padding: '12px 16px', borderRadius: '14px 14px 14px 4px', background: isDark ? 'rgba(26,26,40,0.9)' : 'rgba(255,255,255,0.9)', border: `1px solid ${isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)'}`, display: 'flex', gap: 4, alignItems: 'center' }}>
                  {[0,1,2].map(i => (
                    <div key={i} style={{ width: 6, height: 6, borderRadius: '50%', background: isDark ? '#C5FF47' : '#F12B7E', animation: `typingDot 1.2s ease-in-out ${i * 0.2}s infinite` }}/>
                  ))}
                </div>
              </div>
            )}
            <div ref={bottomRef}/>
          </div>
        </div>

        {/* Quick replies */}
        {messages.length <= 2 && (
          <div style={{ padding: '6px 12px 4px', flexShrink: 0 }}>
            <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 2 }} className="hide-scroll">
              {quickReplies.map(r => (
                <button key={r} onClick={() => setInput(r)} style={{
                  whiteSpace: 'nowrap', padding: '6px 12px', borderRadius: 99,
                  background: isDark ? 'rgba(26,26,40,0.9)' : 'rgba(255,255,255,0.9)',
                  border: `1px solid ${isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)'}`,
                  color: isDark ? '#7777A0' : '#585878', fontSize: 11, cursor: 'pointer', flexShrink: 0,
                }}>{r}</button>
              ))}
            </div>
          </div>
        )}

        {/* Input */}
        <div style={{ padding: '8px 12px 20px', flexShrink: 0, borderTop: `1px solid ${isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)'}` }}>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()}
              placeholder="コーチに話しかける..."
              style={{ flex: 1, padding: '11px 14px', borderRadius: 24, background: isDark ? 'rgba(26,26,40,0.9)' : 'rgba(255,255,255,0.98)', border: `1px solid ${isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)'}`, color: isDark ? '#EEEEF8' : '#1A1A2A', fontSize: 14, outline: 'none', fontFamily: 'Space Grotesk, sans-serif' }}/>
            <button onClick={send} disabled={loading} style={{ width: 42, height: 42, borderRadius: '50%', flexShrink: 0, background: isDark ? 'linear-gradient(135deg, #C5FF47, #A0E030)' : 'linear-gradient(135deg, #F12B7E, #F633A2)', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', opacity: loading ? 0.5 : 1 }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={isDark ? '#08080F' : '#FFF'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── App Root ────────────────────────────────────────────────────────

const SCREENS = {
  home:     HomeScreen,
  plan:     PlanScreen,
  calendar: CalendarScreen,
  record:   RecordScreen,
  town:     TownScreen,
  social:   SocialScreen,
};

const App = () => {
  const [screen, setScreen] = useState('home');
  const [isDark, setIsDark] = useState(true);
  const [animating, setAnimating] = useState(false);
  const [coachOpen, setCoachOpen] = useState(false);
  const [coachMessage, setCoachMessage] = useState(null);
  const theme = isDark ? DARK : LIGHT;

  const navigate = (to) => {
    if (to === screen) return;
    setAnimating(true);
    setTimeout(() => { setScreen(to); setAnimating(false); }, 160);
  };

  const openCoach = (msg = null) => {
    setCoachMessage(msg);
    setCoachOpen(true);
  };

  useEffect(() => {
    const handler = (e) => {
      openCoach(`お疲れ様でした！🎉\n${e.detail.distance}km・${e.detail.time}を完走したんですね！この調子で東京マラソンに向けて頑張りましょう！何か感想や質問はありますか？`);
    };
    window.addEventListener('runRecorded', handler);
    return () => window.removeEventListener('runRecorded', handler);
  }, []);

  const Screen = SCREENS[screen];

  useEffect(() => {
    document.body.style.background = isDark ? '#05050A' : '#C8D8EE';
  }, [isDark]);

  return (
    <ThemeContext.Provider value={theme}>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 18 }}>
        {/* Theme toggle */}
        <div style={{ display: 'flex', gap: 4, padding: 4, background: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)', borderRadius: 99, border: isDark ? '1px solid rgba(255,255,255,0.1)' : '1px solid rgba(0,0,0,0.1)' }}>
          {[{ label: '🌙 ナイト', value: true }, { label: '☀️ デイ', value: false }].map(opt => (
            <button key={String(opt.value)} onClick={() => setIsDark(opt.value)} style={{
              padding: '8px 18px', borderRadius: 99, border: 'none', cursor: 'pointer',
              fontSize: 12, fontWeight: 700, letterSpacing: '-0.01em', transition: 'all 0.2s ease',
              background: isDark === opt.value ? (isDark ? '#C5FF47' : '#E8570A') : 'transparent',
              color: isDark === opt.value ? (isDark ? '#08080F' : '#FFFFFF') : (isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)'),
              boxShadow: isDark === opt.value ? `0 2px 12px ${isDark ? 'rgba(197,255,71,0.4)' : 'rgba(232,87,10,0.4)'}` : 'none',
            }}>{opt.label}</button>
          ))}
        </div>

        {/* Phone frame */}
        <div style={{
          width: 390, height: 844, background: theme.bg, borderRadius: 50, overflow: 'hidden',
          display: 'flex', flexDirection: 'column', fontFamily: "'Space Grotesk', sans-serif",
          color: theme.text, position: 'relative',
          boxShadow: isDark
            ? '0 0 0 8px #111116, 0 0 0 10px #1e1e24, 0 60px 120px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.05)'
            : '0 0 0 8px #C8C0B8, 0 0 0 10px #B0A898, 0 60px 120px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.6)',
          transition: 'background 0.35s ease, box-shadow 0.35s ease',
        }}>
          <div style={{ position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 120, height: 34, background: '#000', borderRadius: 20, zIndex: 200 }}/>
          <StatusBar/>
          <div style={{ flex: 1, overflow: 'hidden', position: 'relative', opacity: animating ? 0 : 1, transition: 'opacity 0.15s ease' }}>
            <Screen onNavigate={navigate} onOpenCoach={openCoach}/>
          </div>
          <BottomNav active={screen} onNavigate={navigate}/>
          <div style={{ position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)', width: 120, height: 5, borderRadius: 3, background: isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.2)', zIndex: 200 }}/>

          {/* AI Coach floating button */}
          {!coachOpen && (
            <button onClick={() => openCoach()} style={{
              position: 'absolute', bottom: 100, right: 20,
              width: 52, height: 52, borderRadius: '50%',
              background: isDark ? 'linear-gradient(135deg, #C5FF47, #A0E030)' : 'linear-gradient(135deg, #F12B7E, #F633A2)',
              border: 'none', cursor: 'pointer', zIndex: 150,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              animation: 'coachPulse 2.5s ease-in-out infinite',
              boxShadow: isDark ? '0 4px 20px rgba(197,255,71,0.4)' : '0 4px 20px rgba(241,43,126,0.4)',
            }}>
              <span style={{ fontSize: 24 }}>🏃</span>
            </button>
          )}
        </div>
      </div>

      {coachOpen && (
        <AICoach
          isDark={isDark}
          onClose={() => { setCoachOpen(false); setCoachMessage(null); }}
          initialMessage={coachMessage}
        />
      )}
    </ThemeContext.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
